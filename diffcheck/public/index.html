<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Diffcheck</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
</head>
<body>
  <header class="topbar">
    <h1><span class="brand">Diff</span>check</h1>
    <div class="topbar-actions">
      <button id="reset" class="btn icon-btn" type="button" aria-label="Reset" title="Reset">
        <svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button id="theme-toggle" class="btn icon-btn" type="button" aria-label="Switch theme" title="Switch theme">
      <svg class="icon icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      <svg class="icon icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    </div>
  </header>

  <main id="app">
    <section id="result" class="result" hidden>
      <div id="notice" class="island notice" role="status" hidden>
        <span id="notice-icon" class="notice-icon"></span>
        <div>
          <h2 id="notice-title" class="notice-title"></h2>
          <p id="notice-text" class="notice-text"></p>
        </div>
      </div>
      <div id="diff-island" class="island" hidden>
        <div id="diff" class="diff-scroll"></div>
      </div>
    </section>

    <section class="editors">
      <div class="editor">
        <label for="original">Original text</label>
        <div class="field">
          <div class="gutter" id="original-gutter" aria-hidden="true"></div>
          <textarea id="original" maxlength="1000000" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste the original text here"></textarea>
        </div>
      </div>
      <div class="editor">
        <label for="changed">Changed text</label>
        <div class="field">
          <div class="gutter" id="changed-gutter" aria-hidden="true"></div>
          <textarea id="changed" maxlength="1000000" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="Paste the changed text here"></textarea>
        </div>
      </div>
    </section>

    <footer class="actions">
      <button id="find" class="btn primary" type="button">Find Difference</button>
    </footer>
  </main>

  <div id="restore" class="toast" role="region" aria-label="Restore session" hidden>
    <p class="toast-msg">Restore your previous session?</p>
    <div class="toast-actions">
      <button id="restore-no" class="btn toast-btn muted" type="button">Dismiss</button>
      <button id="restore-yes" class="btn toast-btn primary" type="button">Restore</button>
    </div>
  </div>

  <script src="/vendor/diff.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
